<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highlighter Q-Bank — GIT</title>
<script>
// Applied before the stylesheet paints so the page never flashes the
// wrong theme on load. Wrapped in try/catch: if localStorage is blocked
// (e.g. some browsers restrict it for local file:// pages), this simply
// falls back to the OS-level light/dark preference.
(function(){
  try{
    var saved = localStorage.getItem("pediacore_theme");
    var theme = (saved === "light" || saved === "dark")
      ? saved
      : ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  } catch(e){
    document.documentElement.setAttribute("data-theme", "light");
  }
})();
</script>

<!-- =========================================================
     HIGHLIGHTER Q-BANK — GIT
     Single-file build: HTML + CSS + JS + Question Data
     This file covers the GIT only.
     Other systems will live in their own separate files.

     Sections:
       1. CSS
       2. HTML Structure
       3. Question Bank Data (GIT)
       4. Application State
       5. Rendering / Navigation Functions
       6. Quiz Setup + Quiz Functions
       7. Results / Review Functions
   ========================================================= -->

<style>
/* =====================================================
   1. CSS
   ===================================================== */
:root{
  --bg: #FBF7F2;
  --surface: #FFFFFF;
  --surface-alt: #F3EAE0;
  --ink: #2B211B;
  --ink-soft: #5C4A3C;
  --muted: #96887A;
  --border: #E8DCCA;

  --primary: #8A5A32;
  --primary-hover: #6E4526;
  --primary-tint: #F0E2D0;

  --accent: #B87F4A;
  --accent-tint: #F7EBDC;

  --success: #2E7D5B;
  --success-tint: #E7F4EE;

  --error: #B24A42;
  --error-tint: #FBEAE8;

  --radius: 8px;
  --shadow: 0 1px 2px rgba(23,26,33,0.05), 0 6px 16px rgba(23,26,33,0.04);
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --topbar-h: 56px;
}

:root[data-theme="dark"]{
  --bg: #1A130E;
  --surface: #241A13;
  --surface-alt: #2E2118;
  --ink: #F3E8DC;
  --ink-soft: #D6C1AC;
  --muted: #A18E7B;
  --border: #3D2E20;

  --primary: #D9A26A;
  --primary-hover: #E8B683;
  --primary-tint: #3A2A1A;

  --accent: #E0A05F;
  --accent-tint: #3C2A19;

  --success: #55B98A;
  --success-tint: #1E3129;

  --error: #E17870;
  --error-tint: #3A2320;

  --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 6px 18px rgba(0,0,0,0.3);
}

*{
  transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
html{ overflow-x: hidden; }
body{ overflow-x: hidden; }
body{
  margin:0;
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.55;
}
button, input{ font-family: inherit; }

.app{
  max-width: 760px;
  margin: 0 auto;
  padding: 0 20px 64px;
}

/* Fixed top bar */
.topbar{
  position: sticky;
  top: 0;
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display:flex;
  align-items:center;
  padding: 0 20px;
  z-index: 100;
}
.topbar-inner{
  max-width: 760px;
  margin: 0 auto;
  width: 100%;
}
.topbar-row{
  display:flex;
  align-items:center;
  justify-content: space-between;
  flex-wrap: nowrap;
}
.brand-mark{
  font-weight: 700;
  font-size: 1.05rem;
  color: var(--ink);
  letter-spacing: -0.01em;
  white-space: nowrap;
  flex-shrink: 0;
}

.theme-toggle{
  display:flex;
  align-items:center;
  justify-content:center;
  background: none;
  border: none;
  color: var(--ink-soft);
  cursor: pointer;
  padding: 7px;
  border-radius: 7px;
  flex-shrink: 0;
}
.theme-toggle:hover{
  background: var(--surface-alt);
  color: var(--primary);
}
.theme-toggle svg{
  width: 18px;
  height: 18px;
  display: block;
}
.theme-toggle .icon-moon{ display: none; }
:root[data-theme="dark"] .theme-toggle .icon-sun{ display: none; }
:root[data-theme="dark"] .theme-toggle .icon-moon{ display: block; }

.content{
  padding-top: 32px;
}

/* Breadcrumb / back link */
.back-link{
  background:none;
  border:none;
  color: var(--muted);
  font-size: 0.85rem;
  cursor:pointer;
  padding: 0;
  margin-bottom: 18px;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.back-link:hover{ color: var(--primary); }

/* Page heading */
h1.page-title{
  font-size: 1.7rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  margin: 0 0 6px;
  color: var(--ink);
}
p.page-subtitle{
  color: var(--muted);
  margin: 0 0 30px;
  font-size: 0.95rem;
}

/* Chapter hero: title + anatomical illustration */
.chapter-hero{
  text-align: center;
  margin: 4px 0 34px;
}
.chapter-title{
  font-size: 1.7rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.28;
  color: var(--ink);
  margin: 0 auto 22px;
  max-width: 420px;
}
.illustration-wrap{
  width: 100%;
  max-width: min(300px, 70vw);
  max-height: 34vh;
  margin: 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
.chapter-image{
  width: 100%;
  height: auto;
  max-height: 34vh;
  object-fit: contain;
  display: block;
}
.illustration-svg-wrap{
  width: 100%;
  display: flex;
}
.illustration-svg-wrap svg{
  width: 100%;
  height: auto;
  display: block;
}

/* Topic buttons: rectangular, subtly rounded, consistent sizing */
.topic-buttons{
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.topic-btn{
  width: 100%;
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 17px 20px;
  text-align:left;
  cursor: pointer;
  color: var(--ink);
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
}
.topic-btn:hover{
  border-color: var(--primary);
  background: var(--surface-alt);
}
.topic-btn:active{ transform: scale(0.99); }
.topic-btn:focus-visible{
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.topic-btn-main{
  display:flex;
  flex-direction: column;
  gap: 3px;
}
.topic-btn-name{
  font-size: 1rem;
  font-weight: 600;
}
.topic-btn-count{
  font-size: 0.8rem;
  color: var(--muted);
}

/* Review History link, bottom-right of the topics screen */
.history-link-row{
  display:flex;
  justify-content: flex-end;
  margin-top: 30px;
}
.btn-history{
  display:inline-flex;
  align-items:center;
  gap: 8px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
}
.btn-history svg{ width: 16px; height: 16px; flex-shrink: 0; }
.btn-history:hover{
  border-color: var(--primary);
  color: var(--primary);
  background: var(--surface-alt);
}

.site-footer{
  text-align: center;
  color: var(--muted);
  font-size: 0.85rem;
  padding: 0 20px 28px;
}
.empty-note{
  color: var(--muted);
  font-size: 0.92rem;
  padding: 20px 4px;
}

/* Buttons */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 7px;
  padding: 11px 20px;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease;
}
.btn:hover{ background: var(--primary-hover); }
.btn:disabled{
  background: var(--border);
  color: var(--muted);
  cursor: not-allowed;
}
.btn-secondary{
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
}
.btn-secondary:hover{
  background: var(--surface-alt);
  border-color: var(--primary);
}
.btn-row{
  display:flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 24px;
}

/* Quiz navigation row: Previous and Next/Finish, same size */
.quiz-nav-row{
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 20px;
}
.quiz-nav-row .btn{
  flex: 1;
}

/* Results screen buttons: Review on the left, Back on the right,
   all matching in style and size */
.results-btn-row{
  display:flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 24px;
}
.results-btn-row .btn{
  flex: 1 1 150px;
  text-align: center;
}

/* Quiz setup screen */
.setup-card{
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 26px;
  text-align: center;
}
.setup-label{
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 10px;
  display:block;
}
.setup-count-row{
  display:flex;
  align-items:center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.count-input{
  width: 90px;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 1rem;
  color: var(--ink);
  background: var(--surface);
}
.count-input:focus{
  outline: none;
  border-color: var(--primary);
}
.count-max-note{
  font-size: 0.83rem;
  color: var(--muted);
}

/* Quiz screen */
.quiz-head{
  display:flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
  gap: 12px;
  flex-wrap: wrap;
}
.quiz-topic-name{
  font-size: 1.15rem;
  font-weight: 700;
  overflow-wrap: break-word;
  word-break: break-word;
  min-width: 0;
}
.quiz-progress-label{
  font-size: 0.82rem;
  color: var(--muted);
  white-space: nowrap;
}
.progress-track{
  height: 4px;
  background: var(--surface-alt);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 28px;
}
.progress-fill{
  height:100%;
  background: var(--primary);
  border-radius: 4px;
  transition: width 0.25s ease;
}

.question-card{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 26px;
}
.question-text{
  white-space: pre-line;
  font-size: 1.08rem;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 20px;
  line-height: 1.5;
}
.question-image{
  max-width: 100%;
  border-radius: 6px;
  margin-bottom: 18px;
  display:block;
}

.options{
  display:flex;
  flex-direction: column;
  gap: 9px;
}
.option{
  display:flex;
  align-items:flex-start;
  gap: 12px;
  text-align:left;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 13px 15px;
  cursor:pointer;
  font-size: 0.95rem;
  color: var(--ink);
  transition: border-color 0.12s ease, background 0.12s ease;
}
.option:hover:not(:disabled){
  border-color: var(--primary);
  background: var(--primary-tint);
}
.option-letter{
  font-weight:700;
  color: var(--primary);
  flex-shrink:0;
  width: 1.3em;
}
.option.correct{
  border-color: var(--success);
  background: var(--success-tint);
}
.option.incorrect{
  border-color: var(--error);
  background: var(--error-tint);
}
.option:disabled{ cursor:default; }

.check-row{
  margin-top: 16px;
  display: flex;
  justify-content: flex-end;
}

.feedback{
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.feedback-status{
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 10px;
}
.feedback-status.correct{ color: var(--success); }
.feedback-status.incorrect{ color: var(--error); }
.feedback-line{
  font-size: 0.92rem;
  color: var(--ink-soft);
  margin: 0 0 12px;
}
.feedback-block{
  background: var(--surface-alt);
  border-radius: 7px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.feedback-block h4{
  margin: 0 0 6px;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  font-weight: 700;
}
.feedback-block p{
  white-space: pre-line;
  margin: 0;
  font-size: 0.92rem;
  color: var(--ink-soft);
}
.summary-block{
  background: var(--accent-tint);
}
.summary-block h4{ color: var(--accent); }
.summary-block ul{
  margin: 0;
  padding-left: 18px;
}
.summary-block li{
  font-size: 0.92rem;
  color: var(--ink-soft);
  margin-bottom: 4px;
}
.summary-block li:last-child{ margin-bottom: 0; }
.summary-block h5.summary-heading{
  margin: 12px 0 6px;
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--accent);
}
.summary-block h4 + h5.summary-heading{ margin-top: 4px; }
.summary-block ul + h5.summary-heading{ margin-top: 14px; }
.summary-block ul ul{
  margin: 4px 0 2px;
  padding-left: 18px;
  list-style: circle;
}
.summary-block ul ul li{ margin-bottom: 2px; }

/* Results */
.results-summary{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 34px 26px;
  text-align:center;
}
.results-eyebrow{
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 14px;
}
.results-score{
  font-size: 2.4rem;
  font-weight: 700;
  color: var(--ink);
  margin: 4px 0;
  letter-spacing: -0.02em;
}
.results-pct{
  font-size: 0.98rem;
  color: var(--muted);
  margin-bottom: 12px;
}
.results-message{
  display:inline-block;
  font-weight:600;
  font-size: 0.85rem;
  padding: 5px 14px;
  border-radius: 20px;
  background: var(--primary-tint);
  color: var(--primary);
}

/* Review */
.review-item{
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--success);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 14px;
}
.review-item.wrong{ border-left-color: var(--error); }
.review-q{
  font-weight:600;
  margin: 0 0 10px;
  color: var(--ink);
}
.review-row{
  font-size: 0.9rem;
  margin: 3px 0;
  color: var(--ink-soft);
}
.review-row.wrong-answer{ color: var(--error); }
.review-row.right-answer{ color: var(--success); }
.review-status{
  display:inline-block;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight:700;
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 8px;
}
.review-status.correct{ background: var(--success-tint); color: var(--success); }
.review-status.incorrect{ background: var(--error-tint); color: var(--error); }

/* History */
.history-item{
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 12px;
  display:flex;
  align-items:center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.12s ease, background 0.12s ease;
}
.history-item:hover:not(:disabled){
  border-color: var(--primary);
  background: var(--surface-alt);
}
.history-item:disabled{
  cursor: default;
  opacity: 0.75;
}
.history-item-main{
  display:flex;
  flex-direction: column;
  gap: 3px;
}
.history-topic{
  font-weight: 600;
  color: var(--ink);
  font-size: 0.98rem;
}
.history-date{
  font-size: 0.8rem;
  color: var(--muted);
}
.history-item-right{
  display:flex;
  align-items:center;
  gap: 10px;
}
.history-item-arrow{
  font-size: 1.05rem;
  color: var(--muted);
}
.history-item:hover:not(:disabled) .history-item-arrow{ color: var(--primary); }
.history-score{
  font-weight: 700;
  color: var(--primary);
  font-size: 1.05rem;
  white-space: nowrap;
}

.screen{ display:none; }
.screen.active{ display:block; }

/* Tablet range (iPad, Android tablets) */
@media (min-width: 700px) and (max-width: 1024px){
  .app{ max-width: 680px; }
  .chapter-title{ font-size: 2rem; max-width: 540px; }
  .illustration-wrap{ max-width: 320px; }
}

/* Small phones */
@media (max-width: 480px){
  .app{ padding: 0 16px 48px; }
  h1.page-title{ font-size: 1.45rem; }
  .chapter-title{ font-size: 1.5rem; max-width: 320px; }
  .quiz-topic-name{ font-size: 1.02rem; }
  .question-card{ padding: 18px; }
  .setup-card{ padding: 20px; }
  .results-score{ font-size: 2rem; }
}

/* Short / landscape phone screens: keep the illustration from
   eating the whole viewport height */
@media (max-height: 560px){
  .illustration-wrap{ max-height: 24vh; }
  .chapter-image{ max-height: 24vh; }
  .chapter-hero{ margin-bottom: 18px; }
}
</style>
</head>
<body>

<!-- =====================================================
     2. HTML STRUCTURE
     ===================================================== -->

<div class="topbar">
  <div class="topbar-inner topbar-row">
    <span class="brand-mark">Highlighter Q-Bank</span>
    <button type="button" id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</div>

<div class="app content">

  <!-- Resume Prompt Screen (shown at launch if an unfinished quiz was saved) -->
  <section id="screen-resume" class="screen">
    <h1 class="page-title">Unfinished Quiz Found</h1>
    <p class="page-subtitle" id="resume-info"></p>
    <div class="btn-row">
      <button class="btn" id="resume-btn">Resume Quiz</button>
      <button class="btn btn-secondary" id="discard-resume-btn">Start Over</button>
    </div>
  </section>

  <!-- Topic List Screen (this file's "home" — GIT) -->
  <section id="screen-topics" class="screen">
    <div class="chapter-hero">
      <h1 class="chapter-title" id="chapter-name"></h1>
      <div class="illustration-wrap">
        <img id="chapter-image" class="chapter-image" width="800" height="648" alt="" style="display:none;">
        <div id="chapter-illustration-fallback" class="illustration-svg-wrap"></div>
      </div>
    </div>

    <div class="topic-buttons" id="topics-list"></div>

    <div class="history-link-row">
      <button type="button" class="btn-history" id="history-link-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        View Results History
      </button>
    </div>
  </section>

  <!-- Subtopics Screen (shown for topics that group several sub-categories,
       e.g. Upper GI Disorders) -->
  <section id="screen-subtopics" class="screen">
    <button class="back-link" id="subtopics-back-btn">&larr; Back to GIT</button>
    <h1 class="page-title" id="subtopics-title"></h1>
    <p class="page-subtitle">Select a category to begin.</p>
    <div class="topic-buttons" id="subtopics-list"></div>
  </section>

  <!-- Results History Screen -->
  <section id="screen-history" class="screen">
    <button class="back-link" id="history-back-btn">&larr; Back to GIT</button>
    <h1 class="page-title">Results History</h1>
    <p class="page-subtitle">Your past quiz attempts, saved on this device.</p>
    <div id="history-list"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="clear-history-btn">Clear History</button>
    </div>
  </section>

  <!-- Quiz Setup Screen -->

/* =====================================================
   4. APPLICATION STATE
   ===================================================== */
const state = {
  currentTopic: null,
  currentTopicPool: [],
  currentParentTopic: null,
  quizQuestions: [],
  currentIndex: 0,
  selectedOptionIndex: null,
  answers: [],
  answeredCurrent: false,
  historyLogged: false
};

/* =====================================================
   PERSISTENCE (localStorage)
   =====================================================
   Two things are saved on this device/browser only:
   1. PROGRESS_KEY — the in-progress quiz, so it can be
      resumed if the file/tab is closed mid-quiz.
   2. HISTORY_KEY — a running log of completed quiz scores.
   All access is wrapped in try/catch: if the browser blocks
   localStorage for local files, the app still works normally,
   it simply won't remember anything between visits.
   ===================================================== */
const PROGRESS_KEY = "pediacore_git_progress_v1";
const HISTORY_KEY = "pediacore_git_history_v1";
const HISTORY_LIMIT = 200;

function saveProgress(){
  try{
    const payload = {
      topic: state.currentTopic,
      topicPool: state.currentTopicPool,
      parentTopic: state.currentParentTopic,
      quizQuestions: state.quizQuestions,
      currentIndex: state.currentIndex,
      answers: state.answers,
      savedAt: Date.now()
    };
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(payload));
  } catch(e){ /* storage unavailable — ignore */ }
}

function loadProgress(){
  try{
    const raw = localStorage.getItem(PROGRESS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function clearProgress(){
  try{ localStorage.removeItem(PROGRESS_KEY); } catch(e){ /* ignore */ }
}

function loadHistory(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch(e){ return []; }
}

function saveHistoryEntry(entry){
  try{
    const history = loadHistory();
    history.unshift(entry);
    if (history.length > HISTORY_LIMIT) history.length = HISTORY_LIMIT;
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch(e){ /* storage unavailable — ignore */ }
}

function clearHistory(){
  try{ localStorage.removeItem(HISTORY_KEY); } catch(e){ /* ignore */ }
}

// Logs the completed attempt to history the moment every question has
// been answered — not only when the student explicitly clicks
// "Finish Quiz". This way a result is still recorded even if the
// student answers the last question and then leaves via a back
// button or closes the file without pressing Finish.
function maybeLogHistory(){
  if (state.historyLogged) return;
  if (state.answers.length < state.quizQuestions.length) return;

  const total = state.answers.length;
  const correct = state.answers.filter(a => a.isCorrect).length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  saveHistoryEntry({
    topic: state.currentTopic,
    correct: correct,
    total: total,
    pct: pct,
    completedAt: Date.now(),
    answers: state.answers
  });
  state.historyLogged = true;
  clearProgress();
}

/* =====================================================
   5. RENDERING / NAVIGATION FUNCTIONS
   ===================================================== */

function el(id){ return document.getElementById(id); }

function showScreen(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  el("screen-" + name).classList.add("active");
  window.scrollTo(0,0);
}

function renderChapterHero(){
  el("chapter-name").textContent = chapter.name;

  const img = el("chapter-image");
  const fallback = el("chapter-illustration-fallback");

  function showFallbackIllustration(){
    img.style.display = "none";
    fallback.style.display = "flex";
    fallback.innerHTML = chapter.illustrationSVG || "";
  }

  if (chapter.image){
    img.onerror = showFallbackIllustration;
    img.src = chapter.image;
    img.style.display = "block";
    fallback.style.display = "none";
  } else {
    showFallbackIllustration();
  }
}

function countQuestions(pool){
  if (Array.isArray(pool)) return pool.length;
  if (pool && typeof pool === "object"){
    return Object.values(pool).reduce((sum, v) => sum + countQuestions(v), 0);
  }
  return 0;
}

function renderTopicList(){
  const list = el("topics-list");
  list.innerHTML = "";
  const topics = chapter.topics || [];

  if (topics.length === 0){
    list.innerHTML = '<p class="empty-note">No topics available yet. Add topics to chapter.topics and questionBank to get started.</p>';
    return;
  }

  topics.forEach(entry => {
    const isNested = typeof entry === "object" && entry !== null;
    const name = isNested ? entry.name : entry;
    const count = countQuestions(questionBank[name]);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "topic-btn";

    const main = document.createElement("span");
    main.className = "topic-btn-main";

    const nameSpan = document.createElement("span");
    nameSpan.className = "topic-btn-name";
    nameSpan.textContent = name;
    main.appendChild(nameSpan);

    const countSpan = document.createElement("span");
    countSpan.className = "topic-btn-count";
    countSpan.textContent = count + (count === 1 ? " question" : " questions");
    main.appendChild(countSpan);

    btn.appendChild(main);

    if (isNested){
      btn.addEventListener("click", () => openSubtopics(entry));
    } else {
      btn.addEventListener("click", () => openTopicSetup(name, questionBank[name] || [], null));
    }
    list.appendChild(btn);
  });
}

// Navigation helpers. A topic entry can have subtopics that are plain names (quiz buttons)
// or objects { name, subtopics } (buttons that open another list of buttons — one level deeper).
function entryPath(entry){ return entry.bankPath || [entry.name]; }

function bankNode(entry){
  let node = questionBank;
  entryPath(entry).forEach(key => { node = (node || {})[key]; });
  return node || {};
}

function makeChildEntry(parent, cfg){
  return { name: cfg.name, subtopics: cfg.subtopics || [], bankPath: entryPath(parent).concat(cfg.name) };
}

function entryParent(entry){
  const path = entryPath(entry);
  if (path.length < 2) return null;
  let cur = (chapter.topics || []).find(x => x && typeof x === "object" && x.name === path[0]);
  for (let i = 1; i < path.length - 1 && cur; i++){
    const cfg = (cur.subtopics || []).find(x => x && typeof x === "object" && x.name === path[i]);
    cur = cfg ? makeChildEntry(cur, cfg) : null;
  }
  return cur || null;
}

function makeTopicButton(name, count){
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "topic-btn";

  const main = document.createElement("span");
  main.className = "topic-btn-main";

  const nameSpan = document.createElement("span");
  nameSpan.className = "topic-btn-name";
  nameSpan.textContent = name;
  main.appendChild(nameSpan);

  const countSpan = document.createElement("span");
  countSpan.className = "topic-btn-count";
  countSpan.textContent = count + (count === 1 ? " question" : " questions");
  main.appendChild(countSpan);

  btn.appendChild(main);
  return btn;
}

function openSubtopics(parentEntry){
  state.currentParentTopic = parentEntry;

  el("subtopics-title").textContent = parentEntry.name;
  const up = entryParent(parentEntry);
  el("subtopics-back-btn").textContent = "\u2190 Back to " + (up ? up.name : "GIT");

  const list = el("subtopics-list");
  list.innerHTML = "";
  const subtopics = parentEntry.subtopics || [];
  const node = bankNode(parentEntry);

  if (subtopics.length === 0){
    list.innerHTML = '<p class="empty-note">No subtopics available yet.</p>';
  }

  subtopics.forEach(sub => {
    if (sub && typeof sub === "object"){
      // a group: opens another list of buttons
      const btn = makeTopicButton(sub.name, countQuestions(node[sub.name]));
      btn.addEventListener("click", () => openSubtopics(makeChildEntry(parentEntry, sub)));
      list.appendChild(btn);
      return;
    }
    const pool = node[sub] || [];
    const btn = makeTopicButton(sub, pool.length);
    const displayName = entryPath(parentEntry).join(" \u2014 ") + " \u2014 " + sub;
    btn.addEventListener("click", () => openTopicSetup(displayName, pool, parentEntry));
    list.appendChild(btn);
  });

  showScreen("subtopics");
}

function goBackFromSubtopics(){
  const up = state.currentParentTopic ? entryParent(state.currentParentTopic) : null;
  if (up) openSubtopics(up);
  else goToTopicList();
}

function goToTopicList(){
  state.currentTopic = null;
  state.currentParentTopic = null;
  clearProgress();
  renderTopicList();
  showScreen("topics");
}

/* =====================================================
   6. QUIZ SETUP + QUIZ FUNCTIONS
   ===================================================== */

function shuffle(array){
  const a = array.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Randomize option order while preserving which option is correct
function randomizeOptions(question){
  const indices = question.options.map((_, i) => i);
  const shuffled = shuffle(indices);
  const newOptions = shuffled.map(i => question.options[i]);
  const newAnswer = shuffled.indexOf(question.answer);
  return Object.assign({}, question, {
    options: newOptions,
    answer: newAnswer
  });
}

function openTopicSetup(displayName, pool, parentEntry){
  state.currentTopic = displayName;
  state.currentTopicPool = pool || [];
  state.currentParentTopic = parentEntry || null;

  const total = state.currentTopicPool.length;

  el("setup-topic-title").textContent = displayName;
  el("setup-back-btn").textContent = parentEntry
    ? ("\u2190 Back to " + parentEntry.name)
    : "\u2190 Back to GIT";

  const countInput = el("count-input");
  const startBtn = el("start-quiz-btn");

  if (total === 0){
    el("count-max-note").textContent = "No questions available yet in this topic.";
    countInput.style.display = "none";
    startBtn.disabled = true;
    showScreen("setup");
    return;
  }

  countInput.style.display = "";
  startBtn.disabled = false;
  el("count-max-note").textContent = "Maximum available: " + total;
  countInput.max = total;
  countInput.value = Math.min(10, total);

  showScreen("setup");
}

function goBackFromSetup(){
  if (state.currentParentTopic){
    openSubtopics(state.currentParentTopic);
  } else {
    goToTopicList();
  }
}

// Picks `requested` questions at random, but never splits a case/data group:
// questions that share a caseId are always taken together and stay in their
// original order, so the student can always solve a case completely.
// Several random attempts are made to hit the exact requested number; only if
// that is impossible without splitting a case, the smallest remaining case is
// added in full (the quiz is then slightly longer than requested).
function selectQuestions(pool, requested){
  const units = [];
  pool.forEach(q => {
    const last = units[units.length - 1];
    if (q.caseId && last && last[0].caseId === q.caseId) last.push(q);
    else units.push([q]);
  });

  let picked = [], skipped = [], count = 0;
  for (let attempt = 0; attempt < 200; attempt++){
    picked = []; skipped = []; count = 0;
    shuffle(units).forEach(u => {
      if (count + u.length <= requested){ picked.push(u); count += u.length; }
      else skipped.push(u);
    });
    if (count === requested) break;
  }
  if (count < requested && skipped.length){
    skipped.sort((a, b) => a.length - b.length);
    picked.push(skipped[0]);
  }
  return shuffle(picked).reduce((all, u) => all.concat(u), []);
}

function startQuiz(){
  const pool = state.currentTopicPool || [];
  const total = pool.length;
  let requested = parseInt(el("count-input").value, 10);

  if (isNaN(requested) || requested < 1) requested = 1;
  if (requested > total) requested = total;

  const chosen = selectQuestions(pool, requested).map(randomizeOptions);

  state.quizQuestions = chosen;
  state.currentIndex = 0;
  state.answers = [];
  state.selectedOptionIndex = null;
  state.answeredCurrent = false;
  state.historyLogged = false;

  el("quiz-topic-title").textContent = state.currentTopic;
  showScreen("quiz");
  showQuestion();
  saveProgress();
}

// If restoredAnswer is provided, the question renders already answered
// (used when resuming a quiz that was saved right after an answer check).
function showQuestion(restoredAnswer){
  const q = state.quizQuestions[state.currentIndex];
  const letters = ["A","B","C","D","E","F"];

  el("quiz-progress-label").textContent = "Question " + (state.currentIndex + 1) + " of " + state.quizQuestions.length;
  el("progress-fill").style.width = (state.currentIndex / state.quizQuestions.length * 100) + "%";

  const img = el("question-image");
  if (q.image){
    img.src = q.image;
    img.style.display = "block";
    img.onerror = function(){ img.style.display = "none"; };
  } else {
    img.style.display = "none";
    img.removeAttribute("src");
  }

  el("question-text").textContent = q.question;

  const optionsContainer = el("options-container");
  optionsContainer.innerHTML = "";

  q.options.forEach((optText, idx) => {
    const optBtn = document.createElement("button");
    optBtn.type = "button";
    optBtn.className = "option";

    const letterSpan = document.createElement("span");
    letterSpan.className = "option-letter";
    letterSpan.textContent = letters[idx] + ".";
    optBtn.appendChild(letterSpan);

    const textSpan = document.createElement("span");
    textSpan.textContent = optText;
    optBtn.appendChild(textSpan);

    optBtn.addEventListener("click", () => selectOption(idx));
    optionsContainer.appendChild(optBtn);
  });

  if (restoredAnswer){
    state.answeredCurrent = true;
    state.selectedOptionIndex = restoredAnswer.selectedIndex;

    const optionButtons = optionsContainer.querySelectorAll(".option");
    optionButtons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.answer) btn.classList.add("correct");
      if (idx === restoredAnswer.selectedIndex && !restoredAnswer.isCorrect) btn.classList.add("incorrect");
    });

    el("check-answer-btn").style.display = "none";
    el("next-btn").style.display = "inline-flex";
    el("next-btn").textContent = (state.currentIndex === state.quizQuestions.length - 1) ? "Finish Quiz" : "Next Question";
    showExplanation(q, restoredAnswer.isCorrect, letters[q.answer]);
  } else {
    state.answeredCurrent = false;
    state.selectedOptionIndex = null;

    el("check-answer-btn").disabled = true;
    el("check-answer-btn").style.display = "inline-flex";
    el("next-btn").style.display = "none";
    el("feedback-area").style.display = "none";
    el("feedback-area").innerHTML = "";
  }

  el("prev-btn").disabled = (state.currentIndex === 0);
}

function selectOption(idx){
  if (state.answeredCurrent) return;
  state.selectedOptionIndex = idx;

  const optionButtons = el("options-container").querySelectorAll(".option");
  optionButtons.forEach((btn, i) => {
    btn.style.borderColor = (i === idx) ? "var(--primary)" : "var(--border)";
    btn.style.background = (i === idx) ? "var(--primary-tint)" : "var(--surface)";
  });

  el("check-answer-btn").disabled = false;
}

function checkAnswer(){
  if (state.answeredCurrent || state.selectedOptionIndex === null) return;
  state.answeredCurrent = true;

  const q = state.quizQuestions[state.currentIndex];
  const selectedIndex = state.selectedOptionIndex;
  const isCorrect = selectedIndex === q.answer;
  const letters = ["A","B","C","D","E","F"];

  state.answers.push({
    question: q.question,
    options: q.options,
    correctAnswer: q.answer,
    selectedIndex: selectedIndex,
    isCorrect: isCorrect,
    explanation: q.explanation,
    summary: q.summary
  });

  const optionButtons = el("options-container").querySelectorAll(".option");
  optionButtons.forEach((btn, idx) => {
    btn.style.borderColor = "";
    btn.style.background = "";
    btn.disabled = true;
    if (idx === q.answer) btn.classList.add("correct");
    if (idx === selectedIndex && !isCorrect) btn.classList.add("incorrect");
  });

  showExplanation(q, isCorrect, letters[q.answer]);

  el("check-answer-btn").style.display = "none";
  el("next-btn").style.display = "inline-flex";
  el("next-btn").textContent = (state.currentIndex === state.quizQuestions.length - 1) ? "Finish Quiz" : "Next Question";

  if (state.currentIndex === state.quizQuestions.length - 1){
    maybeLogHistory();
  } else {
    saveProgress();
  }
}

function showExplanation(q, isCorrect, correctLetter){
  const area = el("feedback-area");
  area.style.display = "block";
  area.innerHTML = "";

  const status = document.createElement("div");
  status.className = "feedback-status " + (isCorrect ? "correct" : "incorrect");
  status.textContent = isCorrect ? "Correct" : "Incorrect";
  area.appendChild(status);

  if (!isCorrect){
    const line = document.createElement("p");
    line.className = "feedback-line";
    line.textContent = "Correct Answer: " + correctLetter + ". " + q.options[q.answer];
    area.appendChild(line);
  }

  if (q.explanation){
    const expBlock = document.createElement("div");
    expBlock.className = "feedback-block";
    const expH = document.createElement("h4");
    expH.textContent = "Scientific Explanation";
    const expP = document.createElement("p");
    expP.textContent = q.explanation;
    expBlock.appendChild(expH);
    expBlock.appendChild(expP);
    area.appendChild(expBlock);
  }

  if (q.summary && q.summary.length){
    const sumBlock = document.createElement("div");
    sumBlock.className = "feedback-block summary-block";
    const sumH = document.createElement("h4");
    sumH.textContent = "Quick Summary";
    sumBlock.appendChild(sumH);
    renderSummaryContent(sumBlock, q.summary);
    area.appendChild(sumBlock);
  }
}

// Renders the "Quick Summary" content. Each item of q.summary can be:
//   "text"                          -> a bullet
//   { heading: "Title" }            -> a sub-heading (starts a new group of bullets)
//   { text: "Parent", items: [...] }-> a bullet with nested sub-bullets
function renderSummaryContent(container, items){
  let ul = null;
  function openList(){
    ul = document.createElement("ul");
    container.appendChild(ul);
  }
  items.forEach(item => {
    if (item && typeof item === "object" && item.heading){
      const h = document.createElement("h5");
      h.className = "summary-heading";
      h.textContent = item.heading;
      container.appendChild(h);
      ul = null;               // bullets after a heading go in a fresh list
      return;
    }
    if (!ul) openList();
    const li = document.createElement("li");
    if (item && typeof item === "object"){
      li.appendChild(document.createTextNode(item.text || ""));
      if (item.items && item.items.length){
        const sub = document.createElement("ul");
        item.items.forEach(s => {
          const sli = document.createElement("li");
          sli.textContent = s;
          sub.appendChild(sli);
        });
        li.appendChild(sub);
      }
    } else {
      li.textContent = item;
    }
    ul.appendChild(li);
  });
}

function nextQuestion(){
  if (!state.answeredCurrent) return;

  if (state.currentIndex < state.quizQuestions.length - 1){
    state.currentIndex++;
    // If this index was already answered earlier (student went back
    // with Previous and is now moving forward again), show it as
    // answered instead of as a fresh question.
    const alreadyAnswered = state.answers.length > state.currentIndex;
    showQuestion(alreadyAnswered ? state.answers[state.currentIndex] : undefined);
    saveProgress();
  } else {
    finishQuiz();
  }
}

function prevQuestion(){
  if (state.currentIndex === 0) return;
  state.currentIndex--;
  showQuestion(state.answers[state.currentIndex]);
  saveProgress();
}

function finishQuiz(){
  el("progress-fill").style.width = "100%";
  maybeLogHistory();
  showResults();
}

/* =====================================================
   7. RESULTS / REVIEW FUNCTIONS
   ===================================================== */

function showResults(){
  const total = state.answers.length;
  const correct = state.answers.filter(a => a.isCorrect).length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  el("results-score").textContent = correct + " / " + total;
  el("results-pct").textContent = "Accuracy: " + pct + "%";

  let message = "Needs Review";
  if (pct >= 90) message = "Excellent";
  else if (pct >= 75) message = "Very Good";
  else if (pct >= 60) message = "Good";

  el("results-message").textContent = message;
  showScreen("results");
}

let reviewReturnTo = "results"; // "results" | "history" — controls the back button on the review screen

function renderReviewList(answersArray, subtitleText){
  el("review-subtitle").textContent = subtitleText;

  const list = el("review-list");
  list.innerHTML = "";
  const letters = ["A","B","C","D","E","F"];

  answersArray.forEach((a, i) => {
    const item = document.createElement("div");
    item.className = "review-item" + (a.isCorrect ? "" : " wrong");

    const status = document.createElement("span");
    status.className = "review-status " + (a.isCorrect ? "correct" : "incorrect");
    status.textContent = a.isCorrect ? "Correct" : "Incorrect";
    item.appendChild(status);

    const qText = document.createElement("p");
    qText.className = "review-q";
    qText.textContent = (i + 1) + ". " + a.question;
    item.appendChild(qText);

    const userRow = document.createElement("p");
    userRow.className = "review-row" + (a.isCorrect ? "" : " wrong-answer");
    userRow.textContent = "Your answer: " + letters[a.selectedIndex] + ". " + a.options[a.selectedIndex];
    item.appendChild(userRow);

    if (!a.isCorrect){
      const correctRow = document.createElement("p");
      correctRow.className = "review-row right-answer";
      correctRow.textContent = "Correct answer: " + letters[a.correctAnswer] + ". " + a.options[a.correctAnswer];
      item.appendChild(correctRow);
    }

    if (a.explanation){
      const expBlock = document.createElement("div");
      expBlock.className = "feedback-block";
      expBlock.style.marginTop = "10px";
      const expH = document.createElement("h4");
      expH.textContent = "Scientific Explanation";
      const expP = document.createElement("p");
      expP.textContent = a.explanation;
      expBlock.appendChild(expH);
      expBlock.appendChild(expP);
      item.appendChild(expBlock);
    }

    list.appendChild(item);
  });

  showScreen("review");
}

function reviewAnswers(){
  reviewReturnTo = "results";
  el("review-back-btn").textContent = "Back to Results";
  renderReviewList(state.answers, state.currentTopic);
}

function reviewHistoryEntry(entry){
  reviewReturnTo = "history";
  el("review-back-btn").textContent = "Back to History";
  const label = entry.topic + " — " + formatHistoryDate(entry.completedAt) +
    " (" + entry.correct + "/" + entry.total + ")";
  renderReviewList(entry.answers || [], label);
}

function restartQuiz(){
  openTopicSetup(state.currentTopic, state.currentTopicPool, state.currentParentTopic);
}

/* =====================================================
   HISTORY SCREEN
   ===================================================== */

function formatHistoryDate(timestamp){
  const d = new Date(timestamp);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) +
    " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

function renderHistory(){
  const list = el("history-list");
  list.innerHTML = "";
  const history = loadHistory();

  if (history.length === 0){
    list.innerHTML = '<p class="empty-note">No quiz results saved yet on this device.</p>';
    return;
  }

  history.forEach(entry => {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "history-item";

    const main = document.createElement("span");
    main.className = "history-item-main";

    const topicEl = document.createElement("span");
    topicEl.className = "history-topic";
    topicEl.textContent = entry.topic;
    main.appendChild(topicEl);

    const dateEl = document.createElement("span");
    dateEl.className = "history-date";
    dateEl.textContent = formatHistoryDate(entry.completedAt);
    main.appendChild(dateEl);

    item.appendChild(main);

    const right = document.createElement("span");
    right.className = "history-item-right";

    const scoreEl = document.createElement("span");
    scoreEl.className = "history-score";
    scoreEl.textContent = entry.correct + " / " + entry.total + " (" + entry.pct + "%)";
    right.appendChild(scoreEl);

    const hasDetails = Array.isArray(entry.answers) && entry.answers.length > 0;
    if (hasDetails){
      const arrow = document.createElement("span");
      arrow.className = "history-item-arrow";
      arrow.textContent = "\u2192";
      right.appendChild(arrow);
    }

    item.appendChild(right);

    if (hasDetails){
      item.addEventListener("click", () => reviewHistoryEntry(entry));
    } else {
      item.disabled = true;
      item.title = "No question details were saved for this attempt.";
    }

    list.appendChild(item);
  });
}

function openHistory(){
  renderHistory();
  showScreen("history");
}

/* =====================================================
   RESUME AN UNFINISHED QUIZ
   ===================================================== */

let pendingResume = null;

function offerResumeIfAvailable(){
  const saved = loadProgress();
  const valid = saved &&
    saved.topic &&
    Array.isArray(saved.quizQuestions) &&
    saved.quizQuestions.length > 0 &&
    typeof saved.currentIndex === "number" &&
    saved.currentIndex < saved.quizQuestions.length;

  if (!valid){
    clearProgress();
    renderTopicList();
    showScreen("topics");
    return;
  }

  pendingResume = saved;
  el("resume-info").textContent = saved.topic + " — Question " + (saved.currentIndex + 1) + " of " + saved.quizQuestions.length;
  showScreen("resume");
}

function resumePendingQuiz(){
  if (!pendingResume) return;

  state.currentTopic = pendingResume.topic;
  state.currentTopicPool = pendingResume.topicPool || [];
  state.currentParentTopic = pendingResume.parentTopic || null;
  state.quizQuestions = pendingResume.quizQuestions;
  state.currentIndex = pendingResume.currentIndex;
  state.answers = pendingResume.answers || [];
  state.historyLogged = false;

  el("quiz-topic-title").textContent = state.currentTopic;
  showScreen("quiz");

  const answeredAlready = state.answers.length > state.currentIndex;
  showQuestion(answeredAlready ? state.answers[state.currentIndex] : undefined);

  pendingResume = null;
}

function discardPendingQuiz(){
  pendingResume = null;
  clearProgress();
  renderTopicList();
  showScreen("topics");
}

/* =====================================================
   DARK / LIGHT MODE TOGGLE
   ===================================================== */
const THEME_KEY = "pediacore_theme";

function toggleTheme(){
  const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY, next); } catch(e){ /* storage unavailable — theme just won't persist */ }
}

/* =====================================================
   EVENT WIRING
   ===================================================== */

el("theme-toggle-btn").addEventListener("click", toggleTheme);
el("setup-back-btn").addEventListener("click", goBackFromSetup);
el("start-quiz-btn").addEventListener("click", startQuiz);
el("check-answer-btn").addEventListener("click", checkAnswer);
el("prev-btn").addEventListener("click", prevQuestion);
el("next-btn").addEventListener("click", nextQuestion);
el("quiz-back-btn").addEventListener("click", goToTopicList);
el("review-btn").addEventListener("click", reviewAnswers);
el("restart-btn").addEventListener("click", restartQuiz);
el("results-back-btn").addEventListener("click", goToTopicList);
el("review-back-btn").addEventListener("click", () => {
  if (reviewReturnTo === "history") openHistory();
  else showScreen("results");
});
el("history-link-btn").addEventListener("click", openHistory);
el("subtopics-back-btn").addEventListener("click", goBackFromSubtopics);
el("history-back-btn").addEventListener("click", goToTopicList);
el("clear-history-btn").addEventListener("click", () => { clearHistory(); renderHistory(); });
el("resume-btn").addEventListener("click", resumePendingQuiz);
el("discard-resume-btn").addEventListener("click", discardPendingQuiz);

/* =====================================================
   INIT
   ===================================================== */
renderChapterHero();
offerResumeIfAvailable();

})();
</script>
